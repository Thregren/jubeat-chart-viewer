# push 到 master 分支或 v* 标签、任意 PR、以及 workflow_dispatch 手动触发时，
# 跑一遍 tools/check.sh --release（外加浏览器回归 / 安卓 Java 单测两个 job）。
# 注意 push 只覆盖 master 与 v* 标签，别处的 push 不会触发本工作流。
#
# 这里守的都是「不会报错、只会静默出错」的东西：
#   * 三份后端（Python 开发服务器 / Electron 静态服务 / PHP 整包）的 Range 与
#     路径穿越语义必须一致 —— 差一点点只表现为某一端进度条拖不动
#   * VERSION 和 index.html 的 ?v= 、electron 包版本必须同步 —— 忘了改就是用户
#     浏览器缓存里一直是老前端
#   * 前端纯逻辑（谱面解析 / 顺序数字 / A–B 打点）的单测
#   * 两种部署模式的端到端接口冒烟（静态直发 + 开发服务器）
#   * 安卓内置服务 / 导入 / 偏好规则的 5 个纯 Java 测试（java-tests job）
#
# tools/check.sh 里的 tools/test_range.py 只比 Python / Node / PHP / serve 四份实现，
# 并不编译或运行 android/test/ 下的 Java 测试；安卓 HttpRange 那份由 java-tests job
# 拿同一张 RANGE_CASES 用例表单独钉住（HttpRange.java 里「由 test_range.py 覆盖」
# 的注释并不成立，别再据此以为 Java 实现已经被 CI 覆盖）。
#
# 桌面包（6 份 zip / AppImage）不在 CI 里打：要 GUI 环境、几分钟，而且产物不入库。
#
# —— 供应链固定策略（重要，改 workflow 时别退化）——
# 第三方 action 一律固定到 commit SHA，并在行尾注释里写清对应的 tag。
# tag 可被上游重打，SHA 不行；这两个 job 会跑打包与浏览器回归，action 被投毒
# 等于产出可被改写。当前已 pin 的清单（2026-11）：
#   actions/checkout        v4.4.0  11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node      v4.4.0  49933ea5288caeca8642d1e84afbd3f7d6820020
#   actions/setup-python    v5.6.0  a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-artifact v4.6.2  ea165f8d65b6e75b540449e92b4886f43607fa02
# 升级时取真实 SHA（不要手抄、不要猜）：
#   gh api repos/actions/checkout/commits/v4 --jq .sha
#   gh api repos/actions/setup-node/commits/v4 --jq .sha
#   gh api repos/actions/setup-python/commits/v5 --jq .sha
#   gh api repos/actions/upload-artifact/commits/v4 --jq .sha
# 然后写成 `uses: actions/checkout@<40位SHA> # v4.x.y`（精确版本可用
#   gh api repos/<owner>/<repo>/tags --jq '.[] | select(.commit.sha=="<SHA>") | .name'
# 核对；别只写 @v4 —— 那等于把产物交给一个可以被移动的指针）。
# Python 依赖同理：tools/requirements.txt 是「精确版本 + 全部产物哈希」，
# 下面两处安装都带 --require-hashes。
# .github/dependabot.yml 负责持续跟进这些 pin 与 npm / pip 依赖。
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      # PHP 入口的冒烟测试要用 php-cli；发布检查缺少 php 时会明确失败
      - name: 装 php-cli
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3 ffmpeg

      - name: 安装缩略图后端
        run: python -m pip install --require-hashes -r tools/requirements.txt

      - name: 安装并审计桌面构建依赖
        working-directory: electron
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm audit --audit-level=moderate --registry=https://registry.npmjs.org

      - name: tools/check.sh --release
        run: sh tools/check.sh --release

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r tools/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: tools/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tools/browser
      - name: Build synthetic library and exercise desktop/mobile browsers
        run: |
          python tools/browser_fixture.py --out "$RUNNER_TEMP/jubeat-browser"
          python tools/serve.py "$RUNNER_TEMP/jubeat-browser/site" --port 18764 > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          fixture_server_pid=$!
          trap 'kill "$fixture_server_pid" 2>/dev/null || true' EXIT
          python -c "import sys; sys.path.insert(0,'tools'); from smoke_test import wait_ready; sys.exit(0 if wait_ready(18764) else 1)"
          node tools/browser_regression.cjs http://127.0.0.1:18764/ "$RUNNER_TEMP/browser-evidence"
          node tools/browser_themes.cjs http://127.0.0.1:18764/ "$RUNNER_TEMP/browser-evidence/themes"
          node tools/browser/pwa-canvas-regression.mjs http://127.0.0.1:18764/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-regression
          path: ${{ runner.temp }}/browser-evidence

  # android/app/src 下只有 HttpRange / PreferenceRules / ArchiveImport / LocalServer
  # 四个类不依赖 android.* / org.json；其余（MainActivity 等）需要 android.jar，
  # 不在纯 JDK 里编译。android/test/ 的 5 个测试都是无 JUnit 的纯 Java main，
  # 用 ubuntu-latest 自带的 javac / java 就能编译运行，所以这里独立成 job。
  java-tests:
    name: Android Java 单测（纯 JDK main）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 编译 5 个测试 + 它们依赖的 4 个纯 Java 类
        run: |
          set -eu
          java -version
          javac -version
          OUT="$RUNNER_TEMP/jubeat-java-classes"
          mkdir -p "$OUT"
          javac -encoding UTF-8 -d "$OUT" \
            android/app/src/world/thregren/jubeatviewer/HttpRange.java \
            android/app/src/world/thregren/jubeatviewer/PreferenceRules.java \
            android/app/src/world/thregren/jubeatviewer/ArchiveImport.java \
            android/app/src/world/thregren/jubeatviewer/LocalServer.java \
            android/test/HttpRangeTest.java \
            android/test/ServerSmoke.java \
            android/test/PreferenceRulesTest.java \
            android/test/ArchiveImportTest.java \
            android/test/LocalServerTest.java
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: 运行 4 个自校验 main
        run: |
          set -eu
          java -cp "$OUT" world.thregren.jubeatviewer.PreferenceRulesTest
          java -cp "$OUT" world.thregren.jubeatviewer.ArchiveImportTest
          java -cp "$OUT" world.thregren.jubeatviewer.LocalServerTest
          java -cp "$OUT" ServerSmoke

      # HttpRangeTest 是 stdin→stdout 的测试台（不是自校验 main），用 tools/test_range.py
      # 里 Python/Node/PHP 共用的 RANGE_CASES / SAFE_CASES 用例表喂进去逐行比对。
      - name: 用共享用例表驱动 HttpRangeTest（Range + 路径穿越）
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess, sys

          out = os.environ["OUT"]
          spec = importlib.util.spec_from_file_location("jv_test_range", "tools/test_range.py")
          tr = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tr)

          def run(args, lines):
              cmd = ["java", "-cp", out] + args
              data = "".join(l + "\n" for l in lines)
              p = subprocess.run(cmd, input=data, capture_output=True, encoding="utf-8")
              if p.returncode != 0:
                  sys.stderr.write(p.stdout + p.stderr)
                  sys.exit("java 失败: " + " ".join(args))
              return p.stdout.splitlines()

          rng = run(["HttpRangeTest"], [f"{s}\t{h}" for s, h, _ in tr.RANGE_CASES])
          want = ["-" if w is None else f"{w[0]}\t{w[1]}" for _, _, w in tr.RANGE_CASES]
          if rng != want:
              bad = [(a, b) for a, b in zip(rng, want) if a != b]
              sys.exit("Range 与共享用例表不一致: " + repr(bad))

          safe = run(["HttpRangeTest", "safe", tr.SAFE_ROOT], [p for p, _ in tr.SAFE_CASES])
          want2 = ["-" if w is None else w for _, w in tr.SAFE_CASES]
          if safe != want2:
              bad2 = [(a, b) for a, b in zip(safe, want2) if a != b]
              sys.exit("resolveSafe 与共享用例表不一致: " + repr(bad2))
          print(f"HttpRangeTest: Range {len(tr.RANGE_CASES)} 例 + resolveSafe {len(tr.SAFE_CASES)} 例 与共享用例表一致")
          PY
