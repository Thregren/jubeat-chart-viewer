<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>jubeat 铺面确认</title>
  <!-- nginx 给 js/css 挂了 12h 缓存：改完 style.css / app.js 记得把 ?v= 一起改掉，
       否则老页面会一直吃缓存里的旧文件（index.html 本身会回源校验，不会卡住）。 -->
  <link rel="stylesheet" href="static/style.css?v=0.5.5" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <button id="btnSidebar" class="icon-btn sidebar-toggle" type="button"
                title="收起 / 展开曲库" aria-label="收起曲库">☰</button>
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="brand-text">
          <h1>铺面确认</h1>
          <p>jubeat chart check</p>
        </div>
      </header>

      <div class="search-block">
        <input id="search" type="search" placeholder="搜索曲名 / 机台 / 作曲…" autocomplete="off" />
        <div class="filter-row">
          <select id="versionFilter" aria-label="机台版本">
            <option value="">全部版本</option>
          </select>
          <select id="sortSelect" aria-label="排序方式">
            <option value="title">排序：曲名</option>
            <option value="version">排序：推出版本（旧→新）</option>
            <option value="bsc-lv">排序：BSC 难度（高→低）</option>
            <option value="adv-lv">排序：ADV 难度（高→低）</option>
            <option value="ext-lv">排序：EXT 难度（高→低）</option>
            <option value="bsc-notes">排序：BSC note 数（多→少）</option>
            <option value="adv-notes">排序：ADV note 数（多→少）</option>
            <option value="ext-notes">排序：EXT note 数（多→少）</option>
          </select>
        </div>
        <div class="filter-row">
          <select id="holdFilter" aria-label="长押筛选">
            <option value="">全部谱面</option>
            <option value="hold">只要长押（含 HOLD）</option>
            <option value="nohold">只要非长押</option>
          </select>
        </div>
      </div>

      <div class="list-meta">
        <span id="listCount">加载中…</span>
        <button id="reindex" class="ghost-btn" type="button">重新读取</button>
      </div>

      <ul id="songList" class="song-list" aria-label="曲目列表"></ul>
    </aside>

    <main class="stage">
      <!-- 手机上曲库是抽屉，默认收起；这里整条都是按钮：面积大、右半边还能避开
           内置浏览器自己放在左上角的 ✕ / 返回 按钮 -->
      <button id="btnSidebarOpen" class="mobile-bar" type="button" aria-label="打开曲库">
        <span class="mobile-bar-icon" aria-hidden="true">☰</span>
        <span class="mobile-bar-title">铺面确认</span>
        <span class="mobile-bar-hint">曲库 ▸</span>
      </button>
      <section class="now-playing" id="nowPlaying">
        <div class="cover-wrap">
          <img id="cover" alt="" />
          <div class="cover-fallback" id="coverFallback">JUBEAT</div>
        </div>
        <div class="np-main">
          <div class="np-kicker" id="npVersion">选择一首曲目</div>
          <h2 id="npTitle">未加载铺面</h2>
          <div class="np-artist" id="npArtist">—</div>
          <div class="diff-row" id="diffRow" role="tablist" aria-label="难度"></div>
        </div>
        <div class="np-side">
          <div class="stat-row" id="statRow">
            <div class="stat"><label>BPM</label><value id="statBpm">—</value></div>
            <div class="stat"><label>NOTE</label><value id="statNotes">—</value></div>
            <div class="stat"><label>HOLD</label><value id="statHolds">—</value></div>
            <div class="stat"><label>TIME</label><value id="statTime">—</value></div>
          </div>
        </div>
      </section>

      <section class="panel-stage">
        <div class="panel-bezel">
          <div class="panel-inner" id="panel" aria-label="jubeat 4x4 面板">
            <!-- 16 pads injected -->
          </div>
          <canvas id="markerCanvas" class="marker-canvas" aria-hidden="true"></canvas>
          <div class="panel-glow" id="panelGlow" aria-hidden="true"></div>
        </div>
        <div class="panel-caption">
          <span id="captionLeft">HIT WINDOW · visual confirm</span>
          <span id="captionRight">4 × 4</span>
        </div>
      </section>

      <section class="transport" id="transport">
        <div class="transport-top">
          <button id="btnCollapse" class="icon-btn" type="button" title="收起 / 展开选项"
                  aria-expanded="true" aria-controls="optionsPanel">⌃</button>
          <button id="btnRestart" class="icon-btn" title="重播 (R)" type="button">↺</button>
          <button id="btnPlay" class="play-btn" title="播放/暂停 (Space)" type="button">
            <span id="playIcon">▶</span>
          </button>
          <button id="btnStop" class="icon-btn" title="停止" type="button">■</button>
          <div class="time-block">
            <span id="timeNow">0:00.00</span>
            <span class="time-sep">/</span>
            <span id="timeTotal">0:00.00</span>
          </div>
          <div class="spacer"></div>
        </div>

        <!-- 音源加载进度：换歌时整首要从服务器上下来，慢网下这段等待得让用户看得见 -->
        <div class="load-row" id="loadRow" hidden>
          <span class="load-label" id="loadLabel">音频加载</span>
          <div class="load-bar" id="loadBar" role="progressbar"
               aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <i class="load-fill" id="loadFill"></i>
          </div>
          <span class="load-pct" id="loadPct">0%</span>
        </div>

        <div class="options" id="optionsPanel">
          <!-- 变速 / 偏移 / 循环收进折叠区：控制条只留播放按钮和时间，省竖向高度 -->
          <div class="opt-row">
            <label class="ctl">速度
              <select id="rate">
                <option value="0.5">0.5×</option>
                <option value="0.75">0.75×</option>
                <option value="1" selected>1.0×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2.0×</option>
              </select>
            </label>
            <label class="ctl">偏移
              <input id="offset" type="number" value="0" step="5" min="-500" max="500" />
              <span class="unit">ms</span>
            </label>
            <label class="ctl checkbox">
              <input id="autoLoop" type="checkbox" />
              循环
            </label>
          </div>
          <div class="opt-row">
            <label class="ctl ctl-wide">marker
              <select id="markerSelect" aria-label="按键 marker 动画">
                <option value="">无（仅面板灯）</option>
              </select>
            </label>
            <label class="ctl">PERFECT 帧
              <input id="anchorInput" type="number" min="0" step="1" value="0"
                     title="这一帧会正好落在 note 时间上" />
            </label>
            <label class="ctl">marker 速度
              <select id="markerSpeed" aria-label="marker 播放速度">
                <option value="0.6">0.6×</option>
                <option value="0.8">0.8×</option>
                <option value="1" selected>1.0×</option>
                <option value="1.25">1.25×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2.0×</option>
              </select>
            </label>
            <label class="ctl">判定特效
              <select id="effectSelect" aria-label="命中特效">
                <option value="">无</option>
              </select>
            </label>
          </div>
          <div class="opt-row">
            <label class="ctl checkbox"><input id="showCombo" type="checkbox" checked /> 总连击</label>
            <label class="ctl checkbox"><input id="showNumbers" type="checkbox" checked /> marker 顺序数字</label>
            <label class="ctl checkbox"><input id="showChordGlow" type="checkbox" checked /> 同押光晕</label>
            <label class="ctl">光晕配色
              <select id="chordGlowPair" aria-label="同押光晕配色"></select>
              <span class="pair-chips" id="glowPairChips" aria-hidden="true"><i></i><i></i></span>
            </label>
            <label class="ctl">打点音
              <select id="metroSound" aria-label="节拍音">
                <option value="">关</option>
                <option value="click">点击</option>
                <option value="clap">拍手</option>
                <option value="nyan">猫娘 nyan</option>
                <option value="taiko">太鼓（咚/咔）</option>
              </select>
            </label>
            <label class="ctl ctl-vol">音量
              <input id="metroVolume" type="range" min="0" max="200" value="60" />
              <span class="unit" id="metroVolumeLabel">60%</span>
            </label>
          </div>
          <div class="anchor-wrap">
            <span class="anchor-label" id="anchorLabel">帧</span>
            <div class="anchor-strip" id="anchorStrip" role="listbox" aria-label="选择 PERFECT 帧"></div>
          </div>
        </div>

        <div class="density-wrap" id="densityWrap">
          <canvas id="densityCanvas" aria-label="物量显示 / 进度条"></canvas>
          <div class="density-hud">
            <span id="densityInfo">物量 · 拖这里跳转</span>
          </div>
        </div>

      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="static/sfx.js"></script>
  <script src="static/app.js?v=0.5.5"></script>
</body>
</html>
