version: 2
updates:
  # Action pin（commit SHA）由 dependabot 跟进；它会把 SHA 连同版本注释一起升级。
  # 与 .github/workflows/ci.yml 顶部的固定策略配套。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  # 桌面壳依赖。CI 用 npm ci，锁文件在 electron/package-lock.json。
  - package-ecosystem: npm
    directory: "/electron"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps(electron)"

  # 浏览器回归夹具依赖（tools/browser/package-lock.json），CI 的 browser job 会 npm ci。
  - package-ecosystem: npm
    directory: "/tools/browser"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(browser)"

  # CI 的 Pillow 依赖。
  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(pip)"
