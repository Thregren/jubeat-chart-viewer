# jubeat 铺面查看器 —— 安全响应头 snippet
#
# 用法：存到 nginx 能读到的地方（例如 /www/server/panel/vhost/nginx/jubeat-security-headers.conf），
#       然后在 server 块**和每个带 add_header 的 location** 里 include 一次。
#
# 为什么不能只写在 server 块：nginx 的 add_header 继承是「有子无父」——
# 只要某个 location 里写了任意一条 add_header，父级的全部 add_header 在该 location 内失效。
#
# 这套 CSP 之所以能收得这么紧，是因为本站：零第三方资源、零内联脚本/样式/事件处理器、
# 零 blob:/data:/Worker。以后真的要引入外链或内联，再按需放开对应的 source
# （尤其别顺手加 'unsafe-inline'）。

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'; form-action 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=(), xr-spatial-tracking=()" always;

# HSTS：确认 *.你的域名 下所有在用的子域都能正常 HTTPS 之后再考虑加 includeSubDomains，
# 加早了会把还没上证书的子域锁死在浏览器里（用户无法回退）。
add_header Strict-Transport-Security "max-age=31536000" always;

# 只广播真正支持的 HTTP/3 版本（h3-25/27/Q046~Q050 是 2019 年的废弃 draft）
# add_header Alt-Svc 'h3=":443"; ma=86400; h3-29=":443"; ma=86400' always;
